services:
  tolka:
    build: .
    ports:
      - "8000:8000"
    environment:
      TOLKA_API_TOKENS: ${TOLKA_API_TOKENS:?set TOLKA_API_TOKENS}
      TOLKA_WHISPER_API_BASE: ${TOLKA_WHISPER_API_BASE:?set TOLKA_WHISPER_API_BASE}
      TOLKA_WHISPER_API_KEY: ${TOLKA_WHISPER_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
      TOLKA_RETENTION_HOURS: ${TOLKA_RETENTION_HOURS:-72}
      TOLKA_PRELOAD_MODELS: ${TOLKA_PRELOAD_MODELS:-false}
    volumes:
      - models:/models
      - data:/data
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  models:
  data:
