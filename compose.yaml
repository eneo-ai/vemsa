x-vemsa-environment: &vemsa-environment
  VEMSA_ENVIRONMENT: production
  VEMSA_API_TOKENS: ${VEMSA_API_TOKENS:?set named credentials as client_id=token}
  VEMSA_DATABASE_URL: postgresql://vemsa:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres/vemsa
  VEMSA_ENGINE: ${VEMSA_ENGINE:-auto}
  VEMSA_WHISPER_API_BASE: ${VEMSA_WHISPER_API_BASE:-}
  VEMSA_WHISPER_API_KEY: ${VEMSA_WHISPER_API_KEY:-}
  # provider model ids differ (e.g. Berget: KBLab/kb-whisper-large, GDM: kb-whisper-large)
  VEMSA_DEFAULT_MODEL: ${VEMSA_DEFAULT_MODEL:-KBLab/kb-whisper-large}
  VEMSA_WHISPER_EXTRA_FORM: ${VEMSA_WHISPER_EXTRA_FORM:-}
  VEMSA_WHISPER_AUTO_LANGUAGE: ${VEMSA_WHISPER_AUTO_LANGUAGE:-}
  HF_TOKEN: ${HF_TOKEN:-}
  VEMSA_RETENTION_HOURS: ${VEMSA_RETENTION_HOURS:-72}
  VEMSA_MAX_AUDIO_BYTES: ${VEMSA_MAX_AUDIO_BYTES:-2147483648}
  VEMSA_MAX_TRANSCRIPT_BYTES: ${VEMSA_MAX_TRANSCRIPT_BYTES:-8388608}
  VEMSA_MAX_QUEUED_JOBS: ${VEMSA_MAX_QUEUED_JOBS:-100}
  VEMSA_MAX_QUEUED_JOBS_PER_CLIENT: ${VEMSA_MAX_QUEUED_JOBS_PER_CLIENT:-10}
  VEMSA_PRELOAD_MODELS: ${VEMSA_PRELOAD_MODELS:-true}
  VEMSA_WEBHOOK_SIGNING_SECRET: ${VEMSA_WEBHOOK_SIGNING_SECRET:-}
  VEMSA_SHUTDOWN_GRACE_S: ${VEMSA_SHUTDOWN_GRACE_S:-540}

x-vemsa-security: &vemsa-security
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:size=1g,mode=1777
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "5"

services:
  api:
    <<: *vemsa-security
    # published variants: ghcr.io/eneo-ai/vemsa:<tag> (CUDA) and <tag>-cpu;
    # default behavior still builds from source — see docs/PRODUCTION.md
    image: ${VEMSA_IMAGE:-ghcr.io/eneo-ai/vemsa:latest}
    build: .
    command:
      - uvicorn
      - vemsa.main:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --no-access-log
    ports:
      # Loopback-only by default; consumers on the same host (or an ingress) connect via
      # 127.0.0.1. Set VEMSA_BIND to a private interface (or 0.0.0.0 behind a firewall)
      # when a consumer such as eneo runs off-host or inside another Docker network.
      - "${VEMSA_BIND:-127.0.0.1}:${VEMSA_PORT:-8000}:8000"
    environment:
      <<: *vemsa-environment
      VEMSA_RUN_WORKER: "false"
    volumes:
      - data:/data
    depends_on:
      postgres:
        condition: service_healthy
      worker:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *vemsa-security
    image: ${VEMSA_IMAGE:-ghcr.io/eneo-ai/vemsa:latest}
    build: .
    command: ["vemsa-worker"]
    environment:
      <<: *vemsa-environment
    volumes:
      - models:/models
      - data:/data
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: ${VEMSA_STOP_GRACE_PERIOD:-10m}
    healthcheck:
      disable: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: vemsa
      POSTGRES_USER: vemsa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vemsa -d vemsa"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

volumes:
  models:
  data:
  postgres-data:
