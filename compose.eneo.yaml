# Optional override: attach the API to a pre-existing shared Docker network so a
# consumer deployment (e.g. eneo's flow execution worker) reaches Vemsa by container
# name instead of a published host port.
#
#   docker network create eneo-shared        # once, or reuse the consumer's network
#   docker compose -f compose.yaml -f compose.eneo.yaml up -d
#
# Override the network name with VEMSA_SHARED_NETWORK. The worker and postgres stay
# off the shared network; only the API is reachable.
services:
  api:
    networks:
      - default
      - shared

networks:
  shared:
    name: ${VEMSA_SHARED_NETWORK:-eneo-shared}
    external: true
