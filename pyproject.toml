[project]
name = "tolka"
version = "0.1.0"
description = "Transcription and speaker-diarization service: OpenAI-compatible whisper provider + local pyannote diarization"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [{ name = "Sundsvalls Kommun" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastmcp>=2.11",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "asyncpg>=0.30,<1",
    "prometheus-client>=0.21,<1",
]

[project.urls]
Repository = "https://github.com/eneo-ai/tolka"
Issues = "https://github.com/eneo-ai/tolka/issues"

[project.scripts]
tolka-worker = "tolka.worker:start"
start = "tolka.dev:main"

[project.optional-dependencies]
diarize = [
    "pyannote-audio>=3.3.1,<4",
    # pyannote 3.x still passes use_auth_token into huggingface_hub, which 1.x removed
    "huggingface-hub>=0.24,<1",
]
align = [
    "easyaligner>=0,<1",
]
local = [
    "easytranscriber==0.3.0",
]
cpu = [
    "torch>=2.7,<2.9",
    "torchaudio",
]
gpu = [
    "torch>=2.7,<2.9",
    "torchaudio",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tolka"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "gpu" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "gpu" },
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = [
    "B008",     # FastAPI Depends() in argument defaults is idiomatic
    "ASYNC109", # small poll helpers take a timeout parameter by design
    "ASYNC240", # tiny local-file Path operations are acceptable in this codebase
]
