name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: vemsa_test
          POSTGRES_USER: vemsa
          POSTGRES_PASSWORD: vemsa-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vemsa -d vemsa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      VEMSA_TEST_POSTGRES_URL: postgresql://vemsa:vemsa-test@localhost:5432/vemsa_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # typechecks and builds the operator dashboard (the Docker image builds it the same way)
      - run: npm ci --no-audit --no-fund
        working-directory: ui
      - run: npm run build
        working-directory: ui

  # images are published only for a main push or v* tag whose tests passed;
  # pull requests never build (they have no registry credentials anyway)
  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # default image: CUDA torch, every engine tier baked in
          - variant: gpu
            extras: diarize align local
            platforms: linux/amd64
            suffix: ""
          # -cpu: for hosts without NVIDIA GPUs. amd64 only: torchcodec (pyannote
          # 4's audio decoder) ships no linux/arm64 wheels; Apple-silicon devs run
          # natively via uv instead (torchcodec has macOS arm64 wheels)
          - variant: cpu
            extras: diarize align local
            platforms: linux/amd64
            suffix: -cpu
    steps:
      - uses: actions/checkout@v4

      # CUDA torch wheels make the gpu image tens of GB during build; reclaim
      # the runner disk that preinstalled toolchains occupy
      - name: Free runner disk space
        if: matrix.variant == 'gpu'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: docker/setup-qemu-action@v3
        if: contains(matrix.platforms, 'arm64')
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platforms }}
          push: true
          build-args: |
            TORCH_VARIANT=${{ matrix.variant }}
            ML_EXTRAS=${{ matrix.extras }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-${{ matrix.variant }}
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-${{ matrix.variant }},mode=max
