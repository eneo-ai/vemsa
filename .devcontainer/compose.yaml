services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    command: sleep infinity
    volumes:
      - ..:/workspace:cached
      - vemsa-venv:/workspace/.venv
    environment:
      # Separate database so the TRUNCATE in the postgres store tests
      # cannot touch dev jobs in the main `vemsa` database.
      VEMSA_TEST_POSTGRES_URL: postgresql://vemsa:vemsa@postgres/vemsa_test
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: vemsa
      POSTGRES_USER: vemsa
      POSTGRES_PASSWORD: vemsa
    volumes:
      - vemsa-postgres-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vemsa -d vemsa"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vemsa-venv:
  vemsa-postgres-data:
